<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1> Estudando Arrow functions</h1>
    <div id="local"></div>
</body>
<script>
 const local = document.querySelector("#local");
 const saudacao = nome => `olá, ${nome}`;
 const question = prompt("qual seu nome?");
 local.textContent = saudacao(question);

 setTimeout(() =>{
    console.log("Oi");
 },1000);
 
</script>
</html>
