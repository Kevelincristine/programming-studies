<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX09</title>
</head>
<body>
    <h1> Estudando tipos de Arrays</h1>
    <div id="local"></div>
</body>
<script>
    const local = document.querySelector("#local");
    const nomes = [
    "julia",
    "rafael",
    "kamily",
    "daniel",
    "miguel",
    "rodrigo"
    ];
    
    const resultado = nomes
    .filter(nome => nome.length === 5)
    .map(nome => nome.toUpperCase());
    
    local.textContent = resultado.join("|");

    const numeros = [ 1,2,3,4,5]
    const resultadotwo = numeros 
    .filter(n => n% 2 === 0)
    .map(n => n * 10);
    
    alert(resultadotwo);
</script>
</html>
